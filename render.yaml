        sync: false
      - key: STRIPE_PRICE_ID_1000
        sync: false
      - key: STRIPE_PRICE_ID_1250
        sync: false
      - key: STRIPE_PRICE_ID_1500
        sync: false
      - key: STRIPE_PRICE_ID_1750
        sync: false
      - key: STRIPE_PRICE_ID_2000
        sync: false
      - key: STRIPE_PRICE_ID_2250
        sync: false
      - key: STRIPE_PRICE_ID_2500
        sync: false
      - key: STRIPE_PRICE_ID_250_YEARLY
        sync: false
      - key: STRIPE_PRICE_ID_500_YEARLY
