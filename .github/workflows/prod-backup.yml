# Production backups - Neon DB (nightly) + Supabase auth (nightly) + R2 receipts mirror (weekly).
#
# Everything uploads ENCRYPTED to an OFF-PROVIDER backup bucket (any S3-compatible target:
# Backblaze B2 or a second Cloudflare account's R2). The whole point is a copy that survives
# the loss of the primary Neon / Cloudflare / Supabase accounts - so the backup bucket must
# NOT live in the same account as the app bucket.
#
# Layout in the backup bucket:
#   daily/YYYY-MM-DD/neon-prod.dump.gpg          (kept 35 days)
#   daily/YYYY-MM-DD/supabase-auth.dump.gpg
#   monthly/YYYY-MM/...                          (kept ~13 months, written on the 1st)
#   receipts-mirror/...                          (rclone sync of the app R2 bucket, Sundays)
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   NEON_PROD_DATABASE_URL        - prod Neon connection string
#   SUPABASE_PROD_DATABASE_URL    - Supabase DIRECT connection string (port 5432, not the
#                                   transaction pooler - pg_dump needs a session connection)
#   BACKUP_ENCRYPTION_PASSPHRASE  - gpg symmetric passphrase; ALSO keep an offline copy -
#                                   without it every backup is unreadable
#   BACKUP_S3_ENDPOINT            - backup bucket S3 endpoint URL
#   BACKUP_S3_ACCESS_KEY_ID
#   BACKUP_S3_SECRET_ACCESS_KEY
#   BACKUP_S3_BUCKET              - backup bucket name
#   APP_R2_ENDPOINT               - app R2 endpoint (https://<account-id>.r2.cloudflarestorage.com)
#   APP_R2_ACCESS_KEY_ID          - use a READ-ONLY R2 token for this
#   APP_R2_SECRET_ACCESS_KEY
#   APP_R2_BUCKET                 - the production receipts bucket name
#
# Failure alerts: GitHub emails the repo owner when a scheduled workflow fails (keep
# "Actions" notifications on). Restore procedures: see BACKUP_RUNBOOK.md.

name: prod-backup

on:
  schedule:
    - cron: '0 3 * * *'   # nightly 03:00 UTC
  workflow_dispatch:
    inputs:
      force_receipts_sync:
        description: 'Also run the receipts mirror now (normally Sundays only)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # pg_dump must be AT LEAST as new as the server. Prod Neon is PG18; a newer client
      # dumps older servers (Supabase) fine, so 18 covers both.
      - name: Install postgres 18 client + rclone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common gnupg unzip
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-18
          # Current rclone (Ubuntu's apt version is years old and predates R2 fixes)
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Dump Neon production database
        env:
          NEON_URL: ${{ secrets.NEON_PROD_DATABASE_URL }}
        run: |
          /usr/lib/postgresql/18/bin/pg_dump "$NEON_URL" -Fc -Z 6 -f neon-prod.dump
          # Integrity sanity: a truncated dump fails to list.
          /usr/lib/postgresql/18/bin/pg_restore --list neon-prod.dump > /dev/null
          ls -la neon-prod.dump

      - name: Dump Supabase auth schema (user identities, password hashes, OAuth links)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_PROD_DATABASE_URL }}
        run: |
          /usr/lib/postgresql/18/bin/pg_dump "$SUPABASE_URL" -Fc -Z 6 --schema=auth -f supabase-auth.dump
          /usr/lib/postgresql/18/bin/pg_restore --list supabase-auth.dump > /dev/null
          ls -la supabase-auth.dump

      - name: Encrypt dumps
        env:
          PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$PASSPHRASE" neon-prod.dump
          gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$PASSPHRASE" supabase-auth.dump
          rm neon-prod.dump supabase-auth.dump

      # Pinpoints credential problems without exposing secrets: prints only short
      # fragments (enough to compare against the Cloudflare dashboard) and runs an
      # explicit read test + write test against the vault bucket.
      - name: Diagnose vault access
        env:
          RCLONE_CONFIG_DEST_TYPE: s3
          RCLONE_CONFIG_DEST_PROVIDER: Cloudflare
          RCLONE_CONFIG_DEST_REGION: auto
          # Scoped R2 tokens cannot answer rclone's "does the bucket exist" probe; without
          # this flag rclone falls back to attempting bucket CREATION, gets AccessDenied,
          # and reports it as an upload failure (verified: the raw S3 PUT is authorized).
          RCLONE_CONFIG_DEST_NO_CHECK_BUCKET: 'true'
          RCLONE_CONFIG_DEST_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          RCLONE_CONFIG_DEST_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_DEST_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
        run: |
          BUCKET=$(echo "$BUCKET" | xargs)
          EP=$(echo "$RCLONE_CONFIG_DEST_ENDPOINT" | xargs)
          KEY=$(echo "$RCLONE_CONFIG_DEST_ACCESS_KEY_ID" | xargs)
          echo "endpoint account id starts with: $(echo "$EP" | sed -E 's#https?://##' | cut -c1-6)"
          echo "access key id starts with:       $(echo "$KEY" | cut -c1-5)"
          echo "--- READ test (list the vault bucket) ---"
          rclone lsf "dest:$BUCKET" --max-depth 1 && echo "READ: OK" || echo "READ: FAILED"
          echo "--- WRITE test (tiny probe object) ---"
          echo probe > probe.txt
          if rclone copyto probe.txt "dest:$BUCKET/probe-delete-me.txt"; then
            echo "WRITE: OK"
            rclone deletefile "dest:$BUCKET/probe-delete-me.txt" || true
          else
            echo "WRITE: FAILED"
          fi

      - name: Upload to backup bucket (daily + monthly on the 1st) and prune old backups
        env:
          # The vault is R2, and R2 needs rclone's Cloudflare profile (region "auto",
          # R2-specific signing). If the vault ever moves to Backblaze/S3, change the
          # provider here and in the mirror step accordingly.
          RCLONE_CONFIG_DEST_TYPE: s3
          RCLONE_CONFIG_DEST_PROVIDER: Cloudflare
          RCLONE_CONFIG_DEST_REGION: auto
          RCLONE_CONFIG_DEST_NO_CHECK_BUCKET: 'true'
          RCLONE_CONFIG_DEST_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          RCLONE_CONFIG_DEST_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_DEST_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
        run: |
          # Defensive: strip any whitespace a paste may have smuggled into the secret.
          BUCKET=$(echo "$BUCKET" | xargs)
          DAY=$(date -u +%F)
          rclone copyto neon-prod.dump.gpg     "dest:$BUCKET/daily/$DAY/neon-prod.dump.gpg"
          rclone copyto supabase-auth.dump.gpg "dest:$BUCKET/daily/$DAY/supabase-auth.dump.gpg"
          if [ "$(date -u +%d)" = "01" ]; then
            MONTH=$(date -u +%Y-%m)
            rclone copyto neon-prod.dump.gpg     "dest:$BUCKET/monthly/$MONTH/neon-prod.dump.gpg"
            rclone copyto supabase-auth.dump.gpg "dest:$BUCKET/monthly/$MONTH/supabase-auth.dump.gpg"
          fi
          # Verify today's upload actually landed before pruning anything.
          rclone lsf "dest:$BUCKET/daily/$DAY/" | grep -q neon-prod.dump.gpg
          rclone lsf "dest:$BUCKET/daily/$DAY/" | grep -q supabase-auth.dump.gpg
          # Retention: ~35 daily, ~13 monthly.
          rclone delete "dest:$BUCKET/daily"   --min-age 35d || true
          rclone delete "dest:$BUCKET/monthly" --min-age 400d || true
          rclone rmdirs "dest:$BUCKET/daily"   --leave-root || true
          rclone rmdirs "dest:$BUCKET/monthly" --leave-root || true
          echo "Backup complete for $DAY"

      - name: Mirror R2 receipts bucket (Sundays, or when forced)
        if: ${{ github.event.inputs.force_receipts_sync == 'true' || github.event_name == 'schedule' }}
        env:
          RCLONE_CONFIG_SRC_TYPE: s3
          RCLONE_CONFIG_SRC_PROVIDER: Cloudflare
          RCLONE_CONFIG_SRC_REGION: auto
          RCLONE_CONFIG_SRC_NO_CHECK_BUCKET: 'true'
          RCLONE_CONFIG_SRC_ENDPOINT: ${{ secrets.APP_R2_ENDPOINT }}
          RCLONE_CONFIG_SRC_ACCESS_KEY_ID: ${{ secrets.APP_R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_SRC_SECRET_ACCESS_KEY: ${{ secrets.APP_R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_DEST_TYPE: s3
          RCLONE_CONFIG_DEST_PROVIDER: Cloudflare
          RCLONE_CONFIG_DEST_REGION: auto
          RCLONE_CONFIG_DEST_NO_CHECK_BUCKET: 'true'
          RCLONE_CONFIG_DEST_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          RCLONE_CONFIG_DEST_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_DEST_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          SRC_BUCKET: ${{ secrets.APP_R2_BUCKET }}
          BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
        run: |
          # Defensive: strip any whitespace a paste may have smuggled into the secrets.
          BUCKET=$(echo "$BUCKET" | xargs)
          SRC_BUCKET=$(echo "$SRC_BUCKET" | xargs)
          # Sundays only on the nightly schedule; a manual dispatch with the checkbox forces it.
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%u)" != "7" ]; then
            echo "Not Sunday - skipping receipts mirror."
            exit 0
          fi
          # copy (not sync --delete): objects deleted in the app bucket SURVIVE in the mirror,
          # so an attacker or accident emptying the app bucket cannot empty the mirror.
          rclone copy "src:$SRC_BUCKET" "dest:$BUCKET/receipts-mirror" --transfers 16 --checkers 32
          echo "Receipts mirror complete."
